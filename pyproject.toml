[project]
name = "icecream-intel"
version = "0.1.0"
description = "RAG assistant for an ice cream brand: LangGraph + PageIndex + DuckDB + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "pageindex>=0.4.4",
    "PyPDF2>=3.0",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
